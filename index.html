<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mazairita · 3er año · Producción Multimedial</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui, sans-serif; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  a-scene { position:fixed !important; inset:0; z-index:1; background:transparent !important; }
  a-scene canvas { background:transparent !important; }
  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:18px; background:rgba(10,12,30,.92); color:#fff; text-align:center; padding:24px; }
  .overlay h1 { margin:0; font-size:1.6rem; }
  .overlay p  { margin:0; opacity:.8; max-width:30ch; }
  .overlay button { font-size:1.2rem; padding:14px 28px; border:0; border-radius:14px; background:#16963a; color:#fff; font-weight:700; }
  .overlay button:disabled { background:#555; }
  #fin { display:none; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<!-- El video va fuera de <a-assets> para que iOS no se quede esperando su precarga -->
<video id="vid" src="3er-anio.mp4" preload="auto" playsinline webkit-playsinline style="display:none"></video>

<div id="inicio" class="overlay">
  <h1>Mazairita · 3er año</h1>
  <p id="estado">Cargando experiencia…</p>
  <button id="btnStart" disabled>Cargando…</button>
  <p style="font-size:.85rem">Vas a necesitar permitir la cámara y los sensores de movimiento.</p>
</div>

<div id="fin" class="overlay">
  <h1>¡Gracias por visitarnos!</h1>
  <p>Terminó la experiencia de 3er año.</p>
  <button onclick="location.reload()">Volver a empezar</button>
</div>

<a-scene vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"
         renderer="alpha:true; antialias:true" embedded="false"
         cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:5">

  <a-assets timeout="120000">
    <a-asset-item id="glbAparicion" src="aparicion-saludo.glb"></a-asset-item>
    <a-asset-item id="glbEspera"    src="espera.glb"></a-asset-item>
    <a-asset-item id="glbGiro"      src="giro2.glb"></a-asset-item>
    <img id="imgSi" src="boton-si.png">
    <img id="imgNo" src="boton-no.png">
  </a-assets>

  <a-entity light="type:ambient; intensity:1.1"></a-entity>
  <a-entity light="type:directional; intensity:1.3" position="1 2 2"></a-entity>

  <!-- Cámara en el origen; la orientación la da el giroscopio -->
  <a-entity id="cam3d" camera="fov:70; near:0.05" position="0 0 0" look-controls="enabled:false"></a-entity>

  <!-- Cada elemento se coloca por separado (ver colocarFrenteAlTelefono) -->
  <a-video id="video3d" src="#vid" width="0.72" height="0.405" visible="false"></a-video>

  <a-entity id="mAparicion" visible="false" gltf-model="#glbAparicion" clip-player></a-entity>
  <a-entity id="mEspera"    visible="false" gltf-model="#glbEspera"    clip-player></a-entity>
  <a-entity id="mGiro"      visible="false" gltf-model="#glbGiro"      clip-player></a-entity>

  <a-entity id="botones" visible="false">
    <a-text value="¿Queres mas informacion?" align="center" width="3.5" color="#FFFFFF" position="0 0.15 0"></a-text>
    <a-image id="btnSi" class="clickable" src="#imgSi" width="0.4" height="0.38" position="-0.3 -0.2 0"></a-image>
    <a-image id="btnNo" class="clickable" src="#imgNo" width="0.4" height="0.38" position="0.3 -0.2 0"></a-image>
  </a-entity>
</a-scene>

<script>
/* ================== CONFIGURACIÓN ================== */
const LINK_SI        = "https://docs.google.com/document/d/1g2UB1Tdas4mCC6SRX_setnILhVluAiEfka7CHQfyujU/edit?usp=sharing";
const ALTURA_ROBOT_M = 0.55;  // alto del robot en pantalla (metros)
const GIRAR_ROBOT_Y  = -90;     // si el robot aparece de espaldas, poné 180

// Posiciones relativas al teléfono al iniciar (metros).
// adelante: hacia donde mira el teléfono · abajo: bajo la altura del teléfono · derecha: positivo = derecha, negativo = izquierda
const ROBOT = { adelante: 2.5, abajo: 1.5, derecha: 0 };   // GLB: 2 m adelante, 0.3 m abajo, 0 m a la izquierda
const VIDEO = { adelante: 1, abajo: 0.3, derecha: 0.5 };    // MP4: 1 m adelante, 0.3 abajo, 0.5 m a la derecha
/* =================================================== */

/* ---- Reproduce las animaciones de cada GLB y avisa cuando terminan ---- */
function elegirClips(anims) {
  const propia = anims.filter(a => /^esqueleto/i.test(a.name));   // "EsqueletoAction..." = animación de ese archivo
  return propia.length ? propia : anims.slice(0, 1);
}
AFRAME.registerComponent('clip-player', {
  init() {
    this.mixer = null; this.pendientes = 0;
    this.el.addEventListener('model-loaded', () => {
      const mesh = this.el.getObject3D('mesh');
      // Ajusta tamaño y apoya el robot en su base, centrado (en coordenadas locales del elemento)
      mesh.position.set(0, 0, 0);
      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3());
      if (size.y > 0) {
        const s = ALTURA_ROBOT_M / size.y;
        mesh.scale.multiplyScalar(s);
        mesh.updateMatrixWorld(true);
        const b2 = new THREE.Box3().setFromObject(mesh);
        const c  = b2.getCenter(new THREE.Vector3());
        const wp = this.el.object3D.getWorldPosition(new THREE.Vector3());
        mesh.position.set(-(c.x - wp.x), -(b2.min.y - wp.y), -(c.z - wp.z));
      }
      this.clips = elegirClips(mesh.animations || []);
      this.mixer = new THREE.AnimationMixer(mesh);
      this.mixer.addEventListener('finished', () => {
        if (--this.pendientes <= 0) this.el.emit('clip-done');
      });
      this.el.emit('clip-ready');
    });
  },
  reproducir(repetir) {
    if (!this.mixer) return;
    this.mixer.stopAllAction();
    this.pendientes = this.clips.length;
    this.clips.forEach(c => {
      const a = this.mixer.clipAction(c);
      a.reset();
      a.setLoop(repetir ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
      a.clampWhenFinished = true;
      a.play();
    });
  },
  tick(t, dt) { if (this.mixer && this.el.object3D.visible) this.mixer.update(dt / 1000); }
});

/* ---- Orientación del teléfono (giroscopio) ---- */
const orient = { alpha:0, beta:0, gamma:0, ok:false };
AFRAME.registerComponent('gyro', {
  init() {
    this.euler = new THREE.Euler(); this.q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
    this.q0 = new THREE.Quaternion(); this.zee = new THREE.Vector3(0, 0, 1);
  },
  tick() {
    if (!orient.ok) return;
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    const d = THREE.MathUtils;
    const q = this.el.object3D.quaternion;
    this.euler.set(d.degToRad(orient.beta), d.degToRad(orient.alpha), -d.degToRad(orient.gamma), 'YXZ');
    q.setFromEuler(this.euler);
    q.multiply(this.q1);
    q.multiply(this.q0.setFromAxisAngle(this.zee, -d.degToRad(ang)));
  }
});
window.addEventListener('deviceorientation', e => {
  if (e.alpha == null && e.beta == null) return;
  orient.alpha = e.alpha || 0; orient.beta = e.beta || 0; orient.gamma = e.gamma || 0; orient.ok = true;
});
document.getElementById('cam3d').setAttribute('gyro', '');

/* ---- Elementos ---- */
const $ = id => document.getElementById(id);
const camVideo = $('cam'), vid = $('vid'), cam3d = $('cam3d');
const mAp = $('mAparicion'), mEs = $('mEspera'), mGi = $('mGiro');
const botones = $('botones'), btnSi = $('btnSi'), btnNo = $('btnNo'), video3d = $('video3d');
const btnStart = $('btnStart');
let estado = 'carga';       // carga | aparicion | espera | giro-si | giro-no | fin
let listos = 0, assetsListos = false;

function mostrarModelo(m) {
  [mAp, mEs, mGi].forEach(x => x.object3D.visible = (x === m));
}
function reproducir(m, repetir) { mostrarModelo(m); m.components['clip-player'].reproducir(repetir); }

/* ---- Carga ---- */
function revisarCarga() {
  if (listos >= 3) {
    btnStart.disabled = false; btnStart.textContent = 'Tocar para comenzar';
    $('estado').textContent = 'Todo listo.';
  }
}
[mAp, mEs, mGi].forEach(m => m.addEventListener('clip-ready', () => { listos++; revisarCarga(); }));
const assets = document.querySelector('a-assets');
if (assets.hasLoaded) { assetsListos = true; } else { assets.addEventListener('loaded', () => { assetsListos = true; revisarCarga(); }); }
revisarCarga();

/* ---- Diagnóstico: avisa si falta algún archivo en el repositorio ---- */
(function () {
  const archivos = ['3er-anio.mp4','aparicion-saludo.glb','espera.glb','giro2.glb','boton-si.png','boton-no.png'];
  Promise.all(archivos.map(f => fetch(f, { method: 'HEAD' }).then(r => r.ok ? null : f).catch(() => f)))
    .then(res => {
      const faltan = res.filter(Boolean);
      if (faltan.length) {
        $('estado').textContent = 'Faltan archivos en el repositorio: ' + faltan.join(', ');
        btnStart.textContent = 'Error de carga';
      }
    });
})();

/* ---- Colocar cada elemento en su posición fija frente al teléfono ---- */
function colocarFrenteAlTelefono() {
  const q = cam3d.object3D.quaternion;
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  const h = new THREE.Vector3(fwd.x, 0, fwd.z);
  if (h.length() < 0.25) {                       // teléfono apuntando muy arriba/abajo
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    h.set(up.x, 0, up.z); if (fwd.y > 0) h.negate();
  }
  if (h.length() < 0.01) h.set(0, 0, -1);
  h.normalize();

  const derecha = new THREE.Vector3(-h.z, 0, h.x);          // vector "derecha" respecto al teléfono
  const rotMirarTelefono = Math.atan2(-h.x, -h.z);          // hace que el elemento mire hacia el usuario
  const giro = THREE.MathUtils.degToRad(GIRAR_ROBOT_Y);

  const punto = p => new THREE.Vector3()
    .copy(h).multiplyScalar(p.adelante)
    .addScaledVector(derecha, p.derecha)
    .setY(-p.abajo);

  const pRobot = punto(ROBOT);
  const pVideo = punto(VIDEO);

  // GLB (los tres modelos comparten posición y orientación)
  [mAp, mEs, mGi].forEach(m => {
    m.object3D.position.copy(pRobot);
    m.object3D.rotation.set(0, rotMirarTelefono + giro, 0);
  });

  // MP4
  video3d.object3D.position.copy(pVideo);
  video3d.object3D.rotation.set(0, rotMirarTelefono, 0);

  // Botones: debajo del robot, con la misma orientación
  botones.object3D.position.copy(pRobot).add(new THREE.Vector3(0, -0.16, 0)).addScaledVector(h, -0.1);
  botones.object3D.rotation.set(0, rotMirarTelefono, 0);
}

/* ---- Inicio ---- */
btnStart.addEventListener('click', async () => {
  btnStart.disabled = true; btnStart.textContent = 'Iniciando…';

  // Permisos que necesitan el toque del usuario (iOS): sensores y audio/video
  let permiso = Promise.resolve('granted');
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    permiso = DeviceOrientationEvent.requestPermission().catch(() => 'denied');
  }
  vid.muted = false;
  vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});

  await permiso;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    camVideo.srcObject = stream; camVideo.play().catch(()=>{});
  } catch (e) {
    $('estado').textContent = 'No se pudo abrir la cámara. Revisá los permisos del navegador.';
    btnStart.disabled = false; btnStart.textContent = 'Reintentar';
    return;
  }

  // Esperar un instante a que el giroscopio entregue datos, luego colocar todo
  await new Promise(r => setTimeout(r, 900));
  if (!orient.ok) cam3d.setAttribute('look-controls', 'enabled:true;magicWindowTrackingEnabled:false'); // PC: arrastrar con el mouse
  colocarFrenteAlTelefono();

  $('inicio').style.display = 'none';
  video3d.object3D.visible = true;
  botones.object3D.visible = false; // Permanece oculto hasta que termina el video
  vid.currentTime = 0; vid.muted = false;
  vid.play().catch(() => { vid.muted = true; vid.play().catch(()=>{}); });

  estado = 'aparicion';
  reproducir(mAp, false);
});

/* ---- Al finalizar el video, aparecen la pregunta y los botones ---- */
vid.onended = () => {
  if (estado !== 'fin') {
    botones.object3D.visible = true;
  }
};

/* ---- Secuencia de animaciones ---- */
mAp.addEventListener('clip-done', () => {
  if (estado !== 'aparicion') return;
  estado = 'espera';
  reproducir(mEs, true);                       // ESPERA en bucle, sin sacar video
});

function ocultarBotones() { botones.object3D.visible = false; btnSi.classList.remove('clickable'); btnNo.classList.remove('clickable'); }

btnSi.addEventListener('click', () => {
  if (estado !== 'aparicion' && estado !== 'espera') return;
  estado = 'giro-si'; ocultarBotones();
  reproducir(mGi, false);
});
btnNo.addEventListener('click', () => {
  if (estado !== 'aparicion' && estado !== 'espera') return;
  estado = 'giro-no'; ocultarBotones();
  vid.pause(); video3d.object3D.visible = false;     // el video desaparece
  reproducir(mGi, false);
});
mGi.addEventListener('clip-done', () => {
  if (estado === 'giro-si') {
    estado = 'fin';
    setTimeout(() => { window.location.href = LINK_SI; }, 300);
  } else if (estado === 'giro-no') {
    terminar();
  }
});

function terminar() {
  estado = 'fin';
  [mAp, mEs, mGi, botones, video3d].forEach(x => x.object3D.visible = false);
  const s = camVideo.srcObject; if (s) s.getTracks().forEach(t => t.stop());
  camVideo.srcObject = null;
  $('fin').style.display = 'flex';
}

// Si el usuario vuelve atrás desde el Google Doc, se reinicia limpio
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
